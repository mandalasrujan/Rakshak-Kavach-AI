# Tool configuration only. Dependencies live in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker", "scripts", "tests"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: requires PostgreSQL and Redis (TEST_DATABASE_URL/TEST_REDIS_URL or Docker)"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]
