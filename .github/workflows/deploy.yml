name: Deploy

# Runs after CI succeeds on a push to main: publishes images, triggers the host's deploy
# hook and smoke-tests the public /health URL. Host-specific settings live in repository
# secrets/variables (see docs/deployment.md); nothing secret is stored in this file.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Image names
        id: names
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "api=${repo}-api" >> "$GITHUB_OUTPUT"
          echo "worker=${repo}-worker" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.api }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.names.outputs.api }}:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.worker }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.names.outputs.worker }}:latest
      - name: Trigger host deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::DEPLOY_HOOK_URL secret not set; images published, deploy skipped."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null
      - name: Smoke test public /health
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          if [ -z "$PUBLIC_BASE_URL" ]; then
            echo "::warning::PUBLIC_BASE_URL variable not set; skipping smoke test."
            exit 0
          fi
          for attempt in $(seq 1 30); do
            if curl -fsS "${PUBLIC_BASE_URL%/}/health"; then exit 0; fi
            sleep 10
          done
          echo "::error::Public /health did not return 200"; exit 1
