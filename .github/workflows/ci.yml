name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    # Full backend suite incl. leakage/RLS, safety, sharing security and the golden eval, all with
    # the deterministic offline LLM provider. Disposable PostgreSQL + pgvector and Redis.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # Throwaway CI-only credentials for an ephemeral service container.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rakshak_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d rakshak_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/rakshak_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Offline retrieval eval (pipeline check, not Gemini quality)
        run: python scripts/eval_retrieval.py --provider fake --answers | tee eval-results/retrieval-fake.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results/
          if-no-files-found: ignore

  migrations:
    # Fresh database: upgrade to head, no model/migration drift, full downgrade, upgrade again.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rakshak_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d rakshak_migrations"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/rakshak_migrations
      APP_DB_USER: rakshak_ci_app
      APP_DB_PASSWORD: ci-only-app-password-0123456789
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: python -m app.db.app_role
      - run: alembic -c backend/alembic.ini downgrade base
      - run: alembic -c backend/alembic.ini upgrade head

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    # M0 acceptance: `docker compose up` starts all services healthy.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with generated secrets
        run: |
          cp .env.example .env
          pg_pw="$(openssl rand -hex 24)"
          jwt="$(openssl rand -hex 48)"
          app_pw="$(openssl rand -hex 24)"
          sed -i "s/change-me-postgres-password/${pg_pw}/g; s/change-me-app-db-password/${app_pw}/g; s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=${jwt}/; s/^LLM_PROVIDER=.*/LLM_PROVIDER=fake/" .env
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test health and auth
        run: |
          curl -fsS http://127.0.0.1:8000/health
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/patient/me)
          test "$code" = "401"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
